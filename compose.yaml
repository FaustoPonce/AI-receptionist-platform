services:
  qdrant:
    image: qdrant/qdrant:v1.19.1-unprivileged
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  qdrant-storage:
  qdrant-snapshots:
